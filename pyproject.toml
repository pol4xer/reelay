[project]
name = "reelay"
version = "0.1.0"
description = "Local Telegram queue for scheduled Instagram Reels publishing"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "python-telegram-bot[job-queue]>=22,<23",
    "yt-dlp[curl-cffi,default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
